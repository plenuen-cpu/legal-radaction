# 윈도우 포터블(.exe) 빌드 — GitHub Actions
#
# 이 파일과 .github/workflows/build-windows.yml 은 같은 내용입니다.
# GitHub은 .github/workflows/ 아래의 워크플로만 실행하므로, 저장소를 만들 때
# 두 파일을 함께 올리면 됩니다. (ci/ 쪽이 원본, .github/ 쪽이 실행본)
name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHON_VERSION: "3.11"
      LLAMA_CPU_INDEX: "https://abetlen.github.io/llama-cpp-python/whl/cpu"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt --extra-index-url $env:LLAMA_CPU_INDEX
          python -c "import llama_cpp, rapidocr, fitz, docx, customtkinter; print('imports ok')"

      - name: Download Korean OCR models
        run: python tools/fetch_ocr_models.py

      - name: Run tests
        run: pytest -q -m "not slow"

      - name: Build portable app
        run: pyinstaller build_windows.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LegalDeid/LegalDeid.exe")) { throw "LegalDeid.exe 없음" }
          if (!(Test-Path "dist/LegalDeid/models/ocr")) { throw "OCR 모델 폴더 없음" }
          Get-ChildItem dist/LegalDeid | Select-Object Name, Length
          $size = [math]::Round((Get-ChildItem dist/LegalDeid -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "배포 폴더 크기: $size MB"

      - name: Add usage note
        shell: pwsh
        run: Copy-Item docs/사용법.txt dist/LegalDeid/사용법.txt -Force

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/LegalDeid/* -DestinationPath "LegalDeid-windows.zip" -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegalDeid-windows
          path: LegalDeid-windows.zip
          retention-days: 30

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LegalDeid-windows.zip
          generate_release_notes: true
